    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // navigation stays same-origin with its initiator and a deduped page

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

    // which fired before we swapped the document. Trigger manually if present.

    }

    setStatus('Error unpacking: ' + err.message);

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ARE Study Coach — all surfaces (v7.1)<\u002Ftitle>\n\n\n\n<!-- ==== tokens.css (inlined, unchanged) ==== -->\n<style>\n/* ==========================================================================\n   ARE Study Coach — TOKENS (V7 · 2026-08-27)\n\n   Paste all three blocks into index.html, replacing the existing :root set.\n   Nothing else in index.html changes.\n\n   ALL 33 TOKENS ARE DECLARED IN ALL THREE THEMES. 33 / 33 / 33.\n   An omitted token is an empty string, not a default. The four that get\n   forgotten — --grid, --grain, --primary-hover, --profile-banner — are at\n   the foot of every block, in the same order, so a missing one is visible.\n\n   CONTRAST — every ratio below was computed, not estimated. The number in\n   each comment is the WCAG 2.1 ratio of that colour against the grounds it\n   actually sits on in this app (--paper / --paper-2 / --card and the three\n   soft tints). Where several apply, the WORST case is quoted. Nothing in\n   this file is below 4.59:1; AA for normal text is 4.5:1.\n\n   The four values that failed last round are all replaced:\n     --ink-soft light  rgba(60,60,67,.6) 3.44 → rgba(60,60,67,.8)  5.27 worst\n     --accent   light  #007AFF           4.02 → #0062C4            4.90 worst\n     --correct  light  #248A3D           4.40 → #1B7030            5.09 worst\n     --accent   dark   #0A84FF           3.82 → #5AACFF            4.74 worst\n\n   Apple's system colours are tuned for fills. This app uses green and red as\n   verdict WORDS, so it uses the accessible variants throughout.\n\n   Text on an --accent fill is always var(--card):\n     light 5.93:1 · dark 5.83:1 · OLED 7.11:1.\n\n   No @import. No url(). No font file. --font is the system stack, which\n   resolves to SF Pro on his iPhone at no cost and works with no signal.\n   ========================================================================== */\n\n:root {\n  /* grounds */\n  --paper: #F2F2F7;                       /* iOS grouped background */\n  --paper-2: #E9E9EE;\n  --card: #FFFFFF;\n\n  /* text */\n  --ink: #000000;                         /* 17.35:1 worst ground (paper-2) */\n  --ink-2: #1C1C1E;                       /* 15.79:1 on card */\n  --ink-soft: rgba(60, 60, 67, .8);       /* 5.27:1 worst · was .6 = 3.44 FAIL */\n  --muted: rgba(60, 60, 67, .75);         /* 4.62:1 worst (paper-2) */\n\n  /* hairlines — non-text, no ratio applies */\n  --line: rgba(60, 60, 67, .18);\n  --line-2: rgba(60, 60, 67, .3);\n\n  /* one interactive colour */\n  --accent: #0062C4;                      /* 4.90:1 worst · was #007AFF = 4.02 FAIL */\n  --accent-soft: #EAF2FD;                 /* accent on it 5.25:1 · ink 18.62:1 */\n  --accent-line: #A9CCEE;                 /* hairline */\n\n  /* verdicts — words, so they must clear AA as text */\n  --correct: #1B7030;                     /* 5.09:1 worst · was #248A3D = 4.40 FAIL */\n  --correct-soft: #E7F3EA;                /* correct on it 5.40:1 */\n  --correct-line: #A9CFB4;                /* hairline */\n\n  --wrong: #B3261E;                       /* 5.40:1 worst */\n  --wrong-soft: #FCEBE9;                  /* wrong on it 5.66:1 */\n  --wrong-line: #EBB6B0;                  /* hairline */\n\n  /* radius ladder 5 / 8 / 11 / 13 / 18 — 13 lives in the stylesheet as\n     --cr-3; these three are the ones index.html and the other sheets read */\n  --r-sm: 8px;\n  --r-md: 11px;\n  --r-lg: 18px;\n\n  /* one tap target. 48, not 44: he is tired and one-handed.\n     The hands-free transport runs 72 and is set in the stylesheet. */\n  --tap: 48px;\n\n  /* flat. Separation is a hairline plus a change of ground. */\n  --shadow-card: none;\n  --shadow-lift: 0 1px 3px rgba(0, 0, 0, .12);\n\n  /* chrome */\n  --chrome-bg: rgba(249, 249, 251, .92);\n  --tab-bg: rgba(249, 249, 251, .94);\n  --overlay-bg: rgba(0, 0, 0, .4);\n\n  /* type stacks — system only, no network */\n  --font: system-ui, -apple-system, \"SF Pro Text\", \"Helvetica Neue\", Helvetica, sans-serif;\n  --mono: ui-monospace, \"SF Mono\", Menlo, Monaco, \"Cascadia Mono\", monospace;\n\n  /* THE FOUR THAT GET FORGOTTEN — declared, never omitted.\n     The design is flat, so the texture overlay is off: transparent and 0.\n     Declaring them off is not the same as leaving them out. */\n  --grid: transparent;\n  --grain: 0;\n  --primary-hover: #00509F;               /* card on it 7.93:1 */\n  --profile-banner: linear-gradient(180deg, #EAF2FD 0%, #F2F2F7 100%);\n}\n\n/* ---------------------------------------------------------------- dark\n   Apple's ELEVATED surface set. #1C1C1E ground, #2C2C2E cards. */\n\n[data-theme=\"dark\"] {\n  --paper: #1C1C1E;\n  --paper-2: #3A3A3C;\n  --card: #2C2C2E;\n\n  --ink: #FFFFFF;                         /* 11.35:1 worst ground (paper-2) */\n  --ink-2: #EBEBF5;                       /* 10.44:1 worst */\n  --ink-soft: rgba(235, 235, 245, .75);   /* 6.19:1 worst */\n  --muted: rgba(235, 235, 245, .6);       /* 4.59:1 worst (paper-2) */\n\n  --line: rgba(235, 235, 245, .16);\n  --line-2: rgba(235, 235, 245, .28);\n\n  --accent: #5AACFF;                      /* 4.74:1 worst · was #0A84FF = 3.82 FAIL */\n  --accent-soft: #12324F;                 /* accent on it 5.51:1 · ink 13.17:1 */\n  --accent-line: #2F5A85;\n\n  --correct: #5FD37E;                     /* 6.00:1 worst */\n  --correct-soft: #123420;                /* correct on it 7.22:1 */\n  --correct-line: #2E6B44;\n\n  --wrong: #FF8A80;                       /* 4.97:1 worst */\n  --wrong-soft: #3B1613;                  /* wrong on it 7.02:1 */\n  --wrong-line: #7A2E28;\n\n  --r-sm: 8px;\n  --r-md: 11px;\n  --r-lg: 18px;\n\n  --tap: 48px;\n\n  --shadow-card: none;\n  --shadow-lift: 0 1px 3px rgba(0, 0, 0, .5);\n\n  --chrome-bg: rgba(28, 28, 30, .92);\n  --tab-bg: rgba(28, 28, 30, .94);\n  --overlay-bg: rgba(0, 0, 0, .6);\n\n  --font: system-ui, -apple-system, \"SF Pro Text\", \"Helvetica Neue\", Helvetica, sans-serif;\n  --mono: ui-monospace, \"SF Mono\", Menlo, Monaco, \"Cascadia Mono\", monospace;\n\n  --grid: transparent;\n  --grain: 0;\n  --primary-hover: #8CC4FF;               /* card on it 7.60:1 */\n  --profile-banner: linear-gradient(180deg, #12324F 0%, #1C1C1E 100%);\n}\n\n/* ---------------------------------------------------------------- OLED\n   Apple's BASE surface set on true black. Same hues as dark; every ratio\n   goes up, none goes down. */\n\n[data-theme=\"oled\"] {\n  --paper: #000000;\n  --paper-2: #2C2C2E;\n  --card: #1C1C1E;\n\n  --ink: #FFFFFF;                         /* 13.94:1 worst ground (paper-2) */\n  --ink-2: #EBEBF5;                       /* 12.82:1 worst */\n  --ink-soft: rgba(235, 235, 245, .8);    /* 8.11:1 worst */\n  --muted: rgba(235, 235, 245, .62);      /* 5.52:1 worst */\n\n  --line: rgba(235, 235, 245, .18);\n  --line-2: rgba(235, 235, 245, .3);\n\n  --accent: #5AACFF;                      /* 5.83:1 worst */\n  --accent-soft: #0B2742;                 /* accent on it 6.35:1 */\n  --accent-line: #27507A;\n\n  --correct: #5FD37E;                     /* 7.37:1 worst */\n  --correct-soft: #0E2B17;                /* correct on it 8.07:1 */\n  --correct-line: #27603C;\n\n  --wrong: #FF8A80;                       /* 6.10:1 worst */\n  --wrong-soft: #33100D;                  /* wrong on it 7.54:1 */\n  --wrong-line: #6E2822;\n\n  --r-sm: 8px;\n  --r-md: 11px;\n  --r-lg: 18px;\n\n  --tap: 48px;\n\n  --shadow-card: none;\n  --shadow-lift: 0 1px 3px rgba(0, 0, 0, .7);\n\n  --chrome-bg: rgba(0, 0, 0, .92);\n  --tab-bg: rgba(0, 0, 0, .94);\n  --overlay-bg: rgba(0, 0, 0, .7);\n\n  --font: system-ui, -apple-system, \"SF Pro Text\", \"Helvetica Neue\", Helvetica, sans-serif;\n  --mono: ui-monospace, \"SF Mono\", Menlo, Monaco, \"Cascadia Mono\", monospace;\n\n  --grid: transparent;\n  --grain: 0;\n  --primary-hover: #8CC4FF;               /* card on it 9.28:1 */\n  --profile-banner: linear-gradient(180deg, #0B2742 0%, #000000 100%);\n}\n\n<\u002Fstyle>\n\n<!-- ==== study-coach.css v7.1 (inlined, unchanged) ==== -->\n<style>\n/* ==========================================================================\n   ARE Study Coach — stylesheet (design pass 2026-08-27 · Apple tightening v7)\n\n   V7 CHANGES, and nothing else:\n     1. SCREEN RHYTHM. The 14 screen-level wrappers had no rules; every screen\n        inherited generic spacing. Each is now a flex column whose single gap\n        is --sp-5, derived from --coach-gap, so the density control moves every\n        gap on every screen at once. Top-level children have their own margins\n        zeroed so there is exactly one source of vertical space per screen.\n     2. au-playing / au-setup. The player had no visible playing state at all.\n        It now carries a persistent accent bar pinned to the top of the screen\n        and an oversized SPEAKING word above the current line, with a ▶ mark so\n        the state is never carried by colour alone. Nothing on that screen was\n        shrunk: the 72px controls and the display-size current line stand.\n     3. .coach-fill got the base rule its five concatenated band variants\n        (strong · developing · weak · danger · untested) were inheriting from\n        nothing.\n     4. HOME DENSITY (V7.1). Home was 13 top-level blocks and 14 starts. It\n        is now five perceived blocks — masthead · tonight · one grouped list\n        of ways in · practise · watch list + utility strip — regrouped\n        entirely by rhythm. Nothing is hidden, nothing is reordered, no\n        element is removed: the two adjacent .coach-modes groups are joined\n        into ONE iOS grouped list, and the tail (bank · reading settings ·\n        backup) is demoted to a hairline utility strip with no ground.\n        The review row is styled to survive collapsing to a single row.\n     5. .coach-pattern is a READINESS element, not an end-of-session one.\n     6. .coach-ref-head removed — it is not in CLASS-INVENTORY.txt and appears\n        nowhere in the markup capture. Section 4 of the brief forbids it.\n   Type is still em-only inside #coachHost. No @import, no url(), no font file.\n\n   THIS FILE REPLACES BOTH `study-coach.css` AND `study-coach-modes.css`.\n   Delete study-coach-modes.css and remove its <link>/<script> reference.\n   Nothing else changes: no JS, no markup, no new class names, no tokens\n   invented — every colour still comes from the app's theme tokens.\n\n   ── The system, stated once ───────────────────────────────────────────────\n\n   TYPE      One scale, in em, so the reader's text-size control moves ALL of\n             it. Never rem inside #coachHost. Six steps only:\n               --fs-label .75  --fs-small .85  --fs-body 1\n               --fs-lead 1.1   --fs-title 1.25 --fs-display 1.75\n             Three weights: 400 / 600 / 700 — but 700 is reserved for\n             headings, verdicts and functional escalation. Anything that is\n             merely bold-for-emphasis sits at 600.\n             Tracking tightens as size grows and is never positive except on\n             the uppercase mono label: --ls-lead / --ls-title / --ls-display.\n             Two families: the system stack, plus ui-serif for exactly two\n             \"remember this\" surfaces (the rule to remember, the formula in\n             words). Nothing else is serif.\n\n   SPACE     One scale, derived from --coach-gap so the density control moves\n             ALL of it: --sp-1 4 · --sp-2 8 · --sp-3 12 · --sp-4 16\n             --sp-5 24 · --sp-6 32 · --sp-7 48 (at the default gap of 16).\n             Vertical rhythm: sp-5 between blocks, sp-6 before a new heading,\n             sp-7 only before a screen-level footer.\n\n   RADIUS    Apple's ladder: xs 5 · sm 8 · md 11 · lg 18 · pill 9999.\n             --cr-0 marks and ticks · --cr-1 controls and inner cells\n             --cr-2 panels · --cr-3 cards. Pills are for PRIMARY ACTIONS and\n             STATUS CHIPS only — never a panel, never a card.\n\n   SURFACE   Flat. Separation is a hairline plus a change of ground —\n             never a shadow, never a decorative left bar. One elevation:\n             none. This also keeps OLED honest.\n\n   COLOUR    ONE interactive colour. --accent means exactly one thing: \"this\n             is the thing you chose, or the thing to do next.\" Not a\n             decoration, a bullet, a band level, a disclosure marker, or a\n             panel tint. --correct / --wrong appear only on verdicts and\n             status marks, always beside a word or a mark.\n\n   MOTION    140ms ease-out for state, 180ms for a disclosure, 0ms on press.\n             Nothing moves on the question screen. One signature: the rule to\n             remember settles in after an answer. Reduced motion removes it.\n\n   ── Functional rules. These are not style. Do not \"clean them up\" ─────────\n     DYSLEXIA      single column, ~62ch measure, 1.7 leading, short blocks,\n                   progressive disclosure, one primary task per screen\n     UNIFORM OPTS  practice options must look identical to each other; on the\n                   real exam the correct answer is never identifiable by shape\n     NOT COLOUR    answered/flagged, right/wrong and band level each carry a\n                   mark, shape or word as well as a hue (~8% of men are\n                   red-green colourblind)\n     READER VARS   --coach-size / --coach-leading / --coach-width / --coach-gap\n                   are set from JS. Style against them; never hardcode type\n                   size, leading, measure or spacing\n     TAB BAR       index.html carries a leftover global\n                   .tab-btn{flex-basis:33.333%}. The .tab-bar .tab-btn\n                   override at the foot of this file beats it on specificity.\n                   Removing it overflows four tabs at 320px\n     OFFLINE       no @import, no font file, no URL of any kind\n   ========================================================================== */\n\n#coachHost {\n  /* reader-controlled inputs (JS writes these) */\n  --coach-size: 1rem;\n  --coach-leading: 1.7;\n  --coach-width: 62ch;\n  --coach-gap: 16px;\n\n  /* type scale */\n  --fs-label: .75em;\n  --fs-small: .85em;\n  --fs-body: 1em;\n  --fs-lead: 1.1em;\n  --fs-title: 1.25em;\n  --fs-display: 1.75em;\n\n  /* optical tracking — tightens as size grows. Body and below stay at 0;\n     the uppercase mono label tracks positive and sets it locally. */\n  --ls-lead: -.01em;\n  --ls-title: -.015em;\n  --ls-display: -.022em;\n\n  /* space scale */\n  --sp-1: calc(var(--coach-gap) * .25);\n  --sp-2: calc(var(--coach-gap) * .5);\n  --sp-3: calc(var(--coach-gap) * .75);\n  --sp-4: var(--coach-gap);\n  --sp-5: calc(var(--coach-gap) * 1.5);\n  --sp-6: calc(var(--coach-gap) * 2);\n  --sp-7: calc(var(--coach-gap) * 3);\n\n  /* radius — Apple's ladder */\n  --cr-0: 5px;\n  --cr-1: 8px;\n  --cr-2: 11px;\n  --cr-3: 13px;\n\n  /* one tap target, everywhere */\n  --tap: 48px;\n\n  /* motion */\n  --mo: 140ms;\n  --mo-open: 180ms;\n  --ease: cubic-bezier(.22, .61, .36, 1);\n\n  font-size: var(--coach-size);\n  line-height: var(--coach-leading);\n  color: var(--ink);\n  -webkit-font-smoothing: antialiased;\n  -webkit-tap-highlight-color: transparent;\n}\n\n/* One column, one measure, room for the fixed tab bar. */\n#coachHost section {\n  max-width: var(--coach-width);\n  margin: 0 auto;\n  padding: var(--sp-3) 0 96px;\n  columns: auto;\n}\n\n#coachHost p {\n  margin: 0 0 var(--sp-4);\n  max-width: var(--coach-width);\n  text-wrap: pretty;\n}\n\n#coachHost p:last-child { margin-bottom: 0; }\n\n/* ========================================================= screen rhythm\n   The 14 screen-level wrappers. Every screen is a single column whose only\n   vertical space is one gap, derived from --coach-gap so the reader's\n   density control moves ALL of it — which is the whole point. Top-level\n   children give up their own margins so there is never a second source.\n\n   Tighter pairs (kicker→title, title→standfirst) pull back up by a negative\n   margin that is itself derived from the same scale. No magic numbers. */\n\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) {\n  --pull-tight: calc(var(--sp-2) - var(--sp-5));\n  --pull-heading: calc(var(--sp-6) - var(--sp-5));\n  display: flex;\n  flex-direction: column;\n  gap: var(--sp-5);\n  max-width: var(--coach-width);\n  margin: 0 auto;\n  padding: var(--sp-4) 0 96px;\n}\n\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > * { margin-top: 0; margin-bottom: 0; }\n\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-kicker + .coach-h2,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-h2 + .coach-reason,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-h2 + .coach-phase,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-h2 + .coach-note,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-kicker + .coach-meta,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-kicker + .au-now,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-reason + .coach-phase { margin-top: var(--pull-tight); }\n\n/* A new heading opens a new block of the screen and gets the wider step. */\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-h3,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-rulegroup,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .mock-block { margin-top: var(--pull-heading); }\n\n/* A screen-level action row is the end of the screen, not another block. */\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-next,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-qfoot,\n#coachHost :is(.coach-home, .coach-review-mode, .coach-q, .coach-end, .coach-examday,\n   .coach-dgroup, .mock-intro, .mock-q, .mock-result, .mock-grid-screen,\n   .mock-rev, .tb-intro, .tb-card, .tb-result) > .coach-review-foot { margin-top: calc(var(--sp-7) - var(--sp-5)); }\n\n/* Review screens lead with tabs; the tabs belong to the kicker above them. */\n#coachHost .coach-review-mode > .coach-viewtabs { margin-top: var(--pull-tight); }\n\n/* Question screen: the option group is the task. Everything else steps back.\n   Nothing here may move when an option is chosen — see the .coach-opt rules. */\n#coachHost .coach-q > .coach-stem { margin-top: var(--pull-tight); }\n#coachHost .coach-q > .coach-hint-none { margin-top: var(--pull-tight); }\n\n/* Intro screens are read before a long sitting: give the standfirst room. */\n#coachHost :is(.mock-intro, .tb-intro) > .coach-reason { font-size: var(--fs-lead); }\n\n/* Result and review screens carry lists, not prose — keep the block step. */\n#coachHost :is(.mock-result, .mock-rev, .tb-result, .mock-grid-screen) > h3 { margin: 0; }\n\n/* The exam-day brief and the diagram group are single-purpose stacks. */\n#coachHost .coach-examday > .coach-examday-block,\n#coachHost .coach-dgroup > .coach-figure { margin: 0; }\n\n#coachHost .coach-dgroup { gap: var(--sp-6); }\n\n/* The end-of-session screen is short and should not float mid-viewport. */\n#coachHost .coach-end { padding-top: var(--sp-5); }\n\n\n#coachHost button,\n#coachHost summary { touch-action: manipulation; }\n\n/* Form controls default to content-box, so width:100% plus padding overflows\n   the column. Do not rely on a global reset from index.html for this. */\n#coachHost input,\n#coachHost textarea,\n#coachHost select { box-sizing: border-box; max-width: 100%; }\n\n#coachHost :focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n/* State transitions. Press is instant — a tap must feel registered. */\n#coachHost button,\n#coachHost .coach-disclose > summary,\n#coachHost .fn-src > summary {\n  transition: background-color var(--mo) var(--ease),\n              border-color var(--mo) var(--ease),\n              color var(--mo) var(--ease);\n}\n\n#coachHost button:active { transition-duration: 0s; }\n\n\n/* ====================================================== home density (V7.1)\n   Home carries the whole app: countdown, phase, tonight's plan, three ways\n   of working, three ways of reading, session lengths, custom minutes, watch\n   list, bank counter, reading settings, backup. Thirteen top-level blocks\n   and fourteen ways to start.\n\n   Nothing here is hidden and nothing is reordered — CSS may not, and should\n   not. The screen is regrouped so those thirteen blocks read as FIVE:\n\n     1  masthead      kicker · countdown · standfirst · phase\n     2  tonight       the only object on the screen with a card\n     3  ways in       both .coach-modes groups, joined into one grouped list\n     4  practise      heading · lengths · custom minutes\n     5  tail          watch list, then a hairline utility strip\n\n   Every step below is derived from --coach-gap. The density control still\n   moves all of it. */\n\n/* --- 1 · masthead. Four lines, one block. The pulls are in the rhythm\n   section above (kicker→h2, h2→reason, reason→phase). Phase is the last\n   line of the masthead, not a block of its own. */\n\n#coachHost .coach-home > .coach-phase { font-size: var(--fs-small); }\n\n/* --- 2 · tonight's plan. THE object. It keeps the card and the ground, and\n   it is now the only thing above the fold that has either — which is what\n   makes the first step findable without reading the screen. */\n\n#coachHost .coach-home > .coach-tonight { margin: 0; }\n\n/* --- 3 · the ways in. Two adjacent grouped lists became one.\n   Six rows, one container, one radius, hairlines between. The major/minor\n   distinction survives as a heavier separator at the join rather than as a\n   gap — Apple separates sections inside a group, not by floating two cards.\n\n   :has() squares off the bottom of the first group only when a second group\n   follows it. Where :has() is unsupported the two groups simply sit as they\n   did before: rounded, adjacent, still legible. */\n\n#coachHost .coach-home > .coach-modes-major:has(+ .coach-modes) {\n  border-bottom-left-radius: 0;\n  border-bottom-right-radius: 0;\n}\n\n#coachHost .coach-home > .coach-modes-major + .coach-modes {\n  margin-top: calc(var(--sp-5) * -1);\n  border-top: 1px solid var(--line-2);\n  border-top-left-radius: 0;\n  border-top-right-radius: 0;\n}\n\n/* The last row of the upper group needs no separator of its own — the join\n   hairline above does that job, and two hairlines would read as a gap. */\n#coachHost .coach-home > .coach-modes-major > .coach-mode:last-child::after { content: none; }\n\n/* The review row collapses to a single row once it opens the review surface\n   at its last-used view. One row must look exactly like one row of a group:\n   no orphan radius, no shrunken height, separator suppressed. */\n#coachHost .coach-home > .coach-modes > .coach-mode:only-child { border-radius: 0; }\n#coachHost .coach-home > .coach-modes > .coach-mode:only-child::after { content: none; }\n\n/* --- 4 · practise. Heading, grid and custom minutes are one block, not\n   three. The heading keeps the wide step above it; everything under it\n   tightens to the small steps. */\n\n#coachHost .coach-home > .coach-h3 + .coach-lengths { margin-top: var(--pull-tight); }\n#coachHost .coach-home > .coach-lengths + .coach-custom { margin-top: calc(var(--sp-3) - var(--sp-5)); }\n#coachHost .coach-home > .coach-custom { margin-top: calc(var(--sp-3) - var(--sp-5)); }\n\n/* --- 5 · the tail.\n   The watch list is a diagnosis, not an action: rows on the page ground,\n   no card, no ground of its own, sitting below everything you can start. */\n\n#coachHost .coach-home > .coach-weak { margin-top: var(--pull-heading); }\n#coachHost .coach-home > .coach-weak h3 { font-size: var(--fs-small); }\n\n/* The utility strip. Bank counter, reading settings and backup were three\n   separate stops with three different grounds. They are now one hairline\n   list at the foot of the screen with no ground at all, aligned to the text\n   column — the iOS pattern for the things you touch once a month.\n\n   Written so any one of the three can leave (the bank counter is moving to\n   Readiness) without the strip losing its top rule or its spacing. */\n\n#coachHost .coach-home > .coach-bank,\n#coachHost .coach-home > .coach-reader,\n#coachHost .coach-home > .coach-backup {\n  margin: 0;\n  padding: 0;\n  border: 0;\n  border-top: 1px solid var(--line);\n  border-radius: 0;\n  background: transparent;\n}\n\n#coachHost .coach-home > .coach-bank { margin-top: var(--pull-heading); padding: var(--sp-3) 0; }\n\n#coachHost .coach-home > .coach-bank + .coach-reader,\n#coachHost .coach-home > .coach-reader + .coach-backup,\n#coachHost .coach-home > .coach-bank + .coach-backup { margin-top: calc(var(--sp-5) * -1); }\n\n/* Whichever of the three comes first carries the step down from the watch\n   list. Later ones sit flush, so the strip reads as one list. */\n#coachHost .coach-home > .coach-weak + .coach-reader,\n#coachHost .coach-home > .coach-weak + .coach-backup { margin-top: var(--pull-heading); }\n\n#coachHost .coach-home > .coach-reader > summary,\n#coachHost .coach-home > .coach-backup > summary {\n  padding-left: 0;\n  padding-right: 0;\n  color: var(--ink-soft);\n  font-weight: 400;\n}\n\n#coachHost .coach-home > .coach-reader > summary::after,\n#coachHost .coach-home > .coach-backup > summary::after { border-color: var(--line); }\n\n/* Contents align to the text column, not to a card inset that is no\n   longer there. */\n#coachHost .coach-home > .coach-reader .coach-reader-grid { padding-left: 0; padding-right: 0; }\n\n#coachHost .coach-home > .coach-backup p,\n#coachHost .coach-home > .coach-backup button { margin-left: 0; margin-right: 0; }\n\n#coachHost .coach-home > .coach-backup { padding-bottom: var(--sp-3); }\n\n/* --- .coach-pattern is a READINESS element. It renders inside the review\n   surface, never on home and never at the end of a session. One sentence\n   naming the pattern behind the misses, ruled top and bottom, sitting in\n   the readiness column's own rhythm. */\n\n#coachHost .coach-review-mode > .coach-pattern { margin: 0; }\n\n/* ------------------------------------------------------------ type basics */\n\n.coach-kicker {\n  font: 600 var(--fs-label)/1.3 var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-h2 {\n  margin: var(--sp-2) 0 var(--sp-3);\n  font-size: var(--fs-display);\n  font-weight: 700;\n  line-height: 1.18;\n  letter-spacing: var(--ls-display);\n  text-wrap: balance;\n}\n\n.coach-h3 {\n  margin: var(--sp-6) 0 var(--sp-3);\n  font-size: var(--fs-body);\n  font-weight: 700;\n  letter-spacing: 0;\n  color: var(--ink);\n}\n\n.coach-reason {\n  color: var(--ink-soft);\n  font-size: var(--fs-lead);\n}\n\n.coach-note {\n  color: var(--muted);\n  font-size: var(--fs-small);\n}\n\n.coach-phase {\n  margin: 0 0 var(--sp-4);\n  color: var(--muted);\n  font-size: var(--fs-small);\n}\n\n.coach-phase b { color: var(--ink-soft); font-weight: 600; }\n.coach-mix { color: var(--muted); font-weight: 400; }\n\n/* --------------------------------------------------------------- controls */\n\n.coach-btn {\n  min-height: var(--tap);\n  padding: 0 var(--sp-4);\n  border: 0;\n  border-radius: var(--cr-2);\n  background: var(--card);\n  color: var(--accent);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.coach-btn:hover { background: var(--paper-2); }\n.coach-btn:active { background: var(--line-2); }\n.coach-btn[disabled] { opacity: .38; cursor: default; }\n\n/* Apple reserves the pill for the primary action. This is the only button\n   in the app that gets one, which is exactly why it reads as the action. */\n/* Any text on an accent fill is var(--card) — see the token header. */\n.coach-btn-primary {\n  border-color: var(--accent);\n  border-radius: 999px;\n  background: var(--accent);\n  color: var(--card);\n}\n\n.coach-btn-primary:hover { border-color: var(--accent); background: var(--accent); }\n.coach-btn-primary:active { opacity: .88; background: var(--accent); }\n\n/* Every screen's action row. The class exists in the markup on 12 screens\n   and previously had no rules at all, so buttons ran together inline. */\n.coach-next {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: var(--sp-2);\n  margin-top: var(--sp-5);\n}\n\n.coach-next .coach-btn { flex: 1 1 auto; justify-content: center; text-align: center; }\n\n.coach-link {\n  min-height: var(--tap);\n  padding: 0;\n  border: 0;\n  background: none;\n  color: var(--ink-soft);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  text-decoration-color: var(--line-2);\n}\n\n.coach-link:hover { color: var(--accent); text-decoration-color: var(--accent-line); }\n\n.coach-icon {\n  display: grid;\n  place-items: center;\n  flex: none;\n  min-width: var(--tap);\n  min-height: var(--tap);\n  border: 0;\n  border-radius: 999px;\n  background: var(--paper-2);\n  color: var(--accent);\n  cursor: pointer;\n  font-size: var(--fs-body);\n}\n\n/* Inline SVG in currentColor. Scales with the reader's text size because it\n   is sized in em, not px. */\n.coach-icon svg {\n  display: block;\n  width: 1.35em;\n  height: 1.35em;\n  fill: none;\n  stroke: currentColor;\n  stroke-width: 1.8;\n  stroke-linecap: round;\n  stroke-linejoin: round;\n}\n\n.coach-icon svg [fill]:not([fill=\"none\"]) { fill: currentColor; stroke: none; }\n\n.coach-icon:active { background: var(--line); }\n\n.coach-mini {\n  min-height: 44px;\n  padding: 0 var(--sp-3);\n  border: 1px solid var(--line-2);\n  border-radius: 999px;\n  background: var(--card);\n  color: var(--ink-soft);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.coach-mini:hover { border-color: var(--ink-soft); color: var(--ink); }\n.coach-mini:active { background: var(--paper-2); }\n\n/* \"on\" here means reviewed / done — it carries a tick, not just a tint. */\n.coach-mini.on {\n  border-color: var(--correct-line);\n  background: var(--correct-soft);\n  color: var(--correct);\n}\n\n.coach-mini.on::before { content: '✓ '; }\n\n.coach-more {\n  min-height: 44px;\n  margin-top: var(--sp-2);\n  padding: 0;\n  border: 0;\n  background: none;\n  color: var(--ink);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  text-decoration-color: var(--line-2);\n}\n\n.coach-more:hover { color: var(--accent); text-decoration-color: var(--accent-line); }\n\n.coach-refill {\n  width: 100%;\n  margin: var(--sp-3) 0;\n  padding: var(--sp-3);\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-2);\n  background: var(--paper);\n  color: var(--ink);\n  font: inherit;\n  font-size: var(--fs-small);\n  line-height: 1.6;\n  resize: vertical;\n}\n\n.coach-refill:focus { border-color: var(--accent); outline: none; }\n\n/* -------------------------------------------------------- session lengths */\n\n.coach-lengths {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: var(--sp-2);\n}\n\n/* .au-len is the same control on the hands-free screen. It previously\n   inherited nothing and rendered as a native button. */\n.coach-len,\n.au-len {\n  display: grid;\n  place-items: center;\n  min-height: 72px;\n  padding: var(--sp-3) var(--sp-2);\n  border: 0;\n  border-radius: var(--cr-2);\n  background: var(--paper-2);\n  color: var(--ink);\n  cursor: pointer;\n  font: inherit;\n}\n\n.coach-len:hover,\n.au-len:hover { background: var(--line); }\n.coach-len:active,\n.au-len:active { background: var(--paper-2); }\n\n.coach-len b,\n.au-len b {\n  font-size: var(--fs-title);\n  font-weight: 700;\n  line-height: 1.2;\n  letter-spacing: var(--ls-title);\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-len span,\n.au-len span {\n  color: var(--muted);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .08em;\n  text-transform: uppercase;\n}\n\n/* Chosen length: accent ground plus heavier text — never hue alone. The\n   ring replaces the old border, which the fill treatment removed. */\n.coach-len.on,\n.au-len.on {\n  background: var(--accent-soft);\n  box-shadow: inset 0 0 0 1.5px var(--accent);\n}\n\n.coach-len.on b,\n.au-len.on b { color: var(--accent); }\n\n.coach-custom {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: var(--sp-2);\n  margin-top: var(--sp-3);\n}\n\n.coach-custom label {\n  display: flex;\n  align-items: center;\n  gap: var(--sp-2);\n  color: var(--muted);\n  font-size: var(--fs-small);\n}\n\n.coach-custom input {\n  width: 84px;\n  min-height: 44px;\n  padding: 0 var(--sp-3);\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-1);\n  background: var(--paper);\n  color: var(--ink);\n  font: inherit;\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-custom input:focus { border-color: var(--accent); outline: none; }\n\n/* ------------------------------------------------------------------- modes */\n\n.coach-modes {\n  display: block;\n  margin: var(--sp-3) 0 0;\n  border-radius: var(--cr-3);\n  background: var(--card);\n  overflow: hidden;\n}\n\n.coach-mode {\n  position: relative;\n  display: grid;\n  gap: var(--sp-1);\n  width: 100%;\n  padding: var(--sp-4);\n  min-height: var(--tap);\n  text-align: left;\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  color: var(--ink);\n  cursor: pointer;\n  font: inherit;\n}\n\n.coach-mode::after {\n  content: '';\n  position: absolute;\n  left: var(--sp-4);\n  right: 0;\n  bottom: 0;\n  height: 1px;\n  background: var(--line);\n}\n\n.coach-mode:last-child::after { content: none; }\n\n.coach-mode:hover { background: var(--paper-2); }\n.coach-mode:active { background: var(--line); }\n\n.coach-mode b { font-size: var(--fs-body); font-weight: 700; }\n.coach-mode span { color: var(--muted); font-size: var(--fs-small); line-height: 1.45; }\n\n/* The three ways of working sit above the three ways of reading. Distance\n   is the whole distinction — they are not a different colour. */\n.coach-modes-major { margin-top: var(--sp-5); margin-bottom: var(--sp-5); }\n\n/* --------------------------------------------------------- tonight's plan */\n\n.coach-tonight {\n  margin: 0 0 var(--sp-5);\n  padding: var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  background: var(--card);\n}\n\n.coach-tonight-kick {\n  display: block;\n  margin-bottom: var(--sp-1);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-tonight-why {\n  margin: 0 0 var(--sp-3);\n  color: var(--ink-soft);\n  font-size: var(--fs-small);\n}\n\n.coach-tonight-steps {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n  counter-reset: step;\n  display: grid;\n  gap: 0;\n}\n\n.coach-tonight-steps li {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: var(--sp-3);\n  min-height: var(--tap);\n  padding: var(--sp-2) 0 var(--sp-2) var(--sp-6);\n  border-top: 1px solid var(--line);\n  min-width: 0;\n}\n\n.coach-tonight-steps li::before {\n  counter-increment: step;\n  content: counter(step);\n  position: absolute;\n  left: 0;\n  top: 50%;\n  transform: translateY(-50%);\n  display: grid;\n  place-items: center;\n  width: 22px;\n  height: 22px;\n  border-radius: 999px;\n  border: 1px solid var(--line-2);\n  color: var(--muted);\n  font: 600 var(--fs-label) var(--mono);\n}\n\n/* KEEP 44px. This button was measured at 27px in production and patched\n   there; the row is tall enough but the button itself must be too. */\n.coach-tonight-go {\n  display: flex;\n  align-items: center;\n  flex: 1;\n  min-width: 0;\n  min-height: 44px;\n  padding: 0;\n  font: inherit;\n  font-weight: 600;\n  color: var(--ink);\n  text-align: left;\n  background: none;\n  border: 0;\n  cursor: pointer;\n  overflow-wrap: anywhere;\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  text-decoration-color: var(--line-2);\n}\n\n.coach-tonight-go:hover { color: var(--accent); text-decoration-color: var(--accent-line); }\n\n.coach-tonight-steps em {\n  flex: none;\n  font-style: normal;\n  font-size: var(--fs-small);\n  color: var(--muted);\n  white-space: nowrap;\n  font-variant-numeric: tabular-nums;\n}\n\n/* An unfinished sitting. Accent, because it is the thing to do next. */\n.coach-resume {\n  margin: 0 0 var(--sp-5);\n  padding: var(--sp-4);\n  border: 1px solid var(--accent-line);\n  border-radius: var(--cr-3);\n  background: var(--accent-soft);\n}\n\n.coach-resume > span {\n  display: block;\n  margin-bottom: var(--sp-1);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--accent);\n}\n\n.coach-resume p { margin: 0 0 var(--sp-3); color: var(--ink-soft); font-size: var(--fs-small); }\n\n/* One sentence naming the pattern behind the misses. */\n.coach-pattern {\n  margin: var(--sp-5) 0;\n  padding: var(--sp-3) 0;\n  border-top: 1px solid var(--line);\n  border-bottom: 1px solid var(--line);\n}\n\n.coach-pattern > span {\n  display: block;\n  margin-bottom: var(--sp-1);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-pattern p { margin: 0; color: var(--ink-soft); font-size: var(--fs-small); }\n\n/* ------------------------------------------------------------- watch list */\n\n.coach-weak { margin-top: var(--sp-6); }\n\n.coach-weak h3 {\n  margin: 0 0 var(--sp-3);\n  font-size: var(--fs-body);\n  font-weight: 700;\n  color: var(--ink);\n}\n\n.coach-weak ul {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n  display: grid;\n  gap: 0;\n  border-top: 1px solid var(--line);\n}\n\n.coach-weak li {\n  display: flex;\n  align-items: baseline;\n  gap: var(--sp-3);\n  padding: var(--sp-3) 0;\n  border-bottom: 1px solid var(--line);\n  font-size: var(--fs-small);\n  line-height: 1.55;\n}\n\n.coach-weak em {\n  margin-left: auto;\n  color: var(--muted);\n  font-style: normal;\n  font-size: var(--fs-label);\n  white-space: nowrap;\n}\n\n.coach-bank {\n  margin-top: var(--sp-5);\n  color: var(--muted);\n  font-size: var(--fs-small);\n}\n\n/* --------------------------------------------------- band + status marks\n   NOT COLOUR: every mark differs by fill and shape as well as hue, so the\n   five states survive greyscale. The renderer also puts a title on each. */\n\n.coach-band,\n.coach-dot {\n  box-sizing: border-box;\n  flex: none;\n  display: inline-block;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  vertical-align: middle;\n}\n\n.coach-dot { margin-right: var(--sp-3); }\n.coach-band { align-self: center; }\n\n.coach-band-strong,\n.coach-dot-strong { background: var(--correct); }\n\n/* Half-filled, in ink — a band level is a status, not an affordance, so it\n   does not get the interactive colour. The shape still separates it. */\n.coach-band-developing,\n.coach-dot-developing {\n  background: linear-gradient(to right, var(--ink-soft) 50%, transparent 50%);\n  border: 1.5px solid var(--ink-soft);\n}\n\n.coach-band-weak,\n.coach-dot-weak {\n  background: transparent;\n  border: 2.5px solid var(--wrong);\n  opacity: 1;\n}\n\n.coach-band-danger,\n.coach-dot-danger {\n  background: var(--wrong);\n  border: 1.5px solid var(--wrong);\n  box-shadow: 0 0 0 3px var(--wrong-soft);\n}\n\n.coach-dot-untested,\n.coach-band-untested {\n  background: transparent;\n  border: 1.5px dashed var(--muted);\n}\n\n/* ------------------------------------------------------------------- tabs */\n\n.coach-viewtabs {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--sp-1);\n  margin: var(--sp-3) 0 var(--sp-5);\n  padding: var(--sp-1);\n  border-radius: var(--cr-2);\n  background: var(--paper-2);\n}\n\n.coach-viewtab {\n  flex: 1 1 auto;\n  min-height: 44px;\n  padding: 0 var(--sp-3);\n  border: 1px solid transparent;\n  border-radius: var(--cr-1);\n  background: none;\n  color: var(--muted);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n  white-space: nowrap;\n}\n\n.coach-viewtab:hover { color: var(--ink); }\n\n.coach-viewtab.on {\n  border-color: var(--line);\n  background: var(--card);\n  color: var(--ink);\n  font-weight: 700;\n}\n\n.coach-rules-modes { margin-bottom: var(--sp-4); }\n\n.coach-sectabs {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: var(--sp-2);\n  margin-bottom: var(--sp-5);\n}\n\n.coach-sectab {\n  display: grid;\n  gap: var(--sp-1);\n  align-content: start;\n  min-height: var(--tap);\n  padding: var(--sp-3);\n  text-align: left;\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-2);\n  background: var(--card);\n  color: var(--ink);\n  cursor: pointer;\n  font: inherit;\n}\n\n.coach-sectab:hover { border-color: var(--ink-soft); }\n\n.coach-sectab.on {\n  border-color: var(--accent);\n  background: var(--accent-soft);\n}\n\n.coach-sectab b { font-size: var(--fs-small); font-weight: 700; }\n.coach-sectab span { color: var(--muted); font-size: var(--fs-label); line-height: 1.4; }\n\n.coach-sectab em {\n  color: var(--ink-soft);\n  font: 600 var(--fs-label) var(--mono);\n  font-style: normal;\n  letter-spacing: .04em;\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-sectab.on em { color: var(--accent); }\n\n/* ------------------------------------------------------------ skim cards */\n\n.coach-cards {\n  display: block;\n  border-radius: var(--cr-3);\n  background: var(--card);\n  overflow: hidden;\n}\n\n.coach-card {\n  position: relative;\n  padding: var(--sp-4);\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n}\n\n.coach-card::after {\n  content: '';\n  position: absolute;\n  left: var(--sp-4);\n  right: 0;\n  bottom: 0;\n  height: 1px;\n  background: var(--line);\n}\n\n.coach-card:last-child::after { content: none; }\n\n/* Reviewed: a tick on the button already says so. The card only softens. */\n.coach-card.done .coach-card-title { color: var(--ink-soft); }\n\n.coach-card-head { cursor: pointer; }\n\n.coach-card-title {\n  display: flex;\n  align-items: baseline;\n  font-size: var(--fs-lead);\n  font-weight: 700;\n  line-height: 1.35;\n  letter-spacing: var(--ls-lead);\n}\n\n.coach-card-sub {\n  /* clears the 10px dot plus its gap — derived, not a magic number */\n  margin: var(--sp-1) 0 0 calc(10px + var(--sp-3));\n  color: var(--muted);\n  font: 400 var(--fs-label) var(--mono);\n  letter-spacing: .03em;\n}\n\n.coach-lead {\n  margin: var(--sp-3) 0 var(--sp-3) !important;\n  color: var(--ink-soft);\n  font-size: var(--fs-body);\n}\n\n.coach-points {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n  display: grid;\n  gap: var(--sp-3);\n}\n\n.coach-points li {\n  position: relative;\n  padding-left: var(--sp-4);\n  font-size: var(--fs-body);\n  line-height: var(--coach-leading);\n}\n\n.coach-points li::before {\n  content: '';\n  position: absolute;\n  left: 2px;\n  top: .68em;\n  width: 5px;\n  height: 5px;\n  border-radius: 50%;\n  background: var(--line-2);\n}\n\n.coach-takeaway {\n  margin-top: var(--sp-4);\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--paper-2);\n}\n\n.coach-takeaway p { margin: 0 0 var(--sp-2) !important; font-size: var(--fs-small); }\n.coach-takeaway p:last-child { margin-bottom: 0 !important; }\n\n.coach-card-foot {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--sp-2);\n  margin-top: var(--sp-4);\n}\n\n.coach-review-foot {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: var(--sp-2);\n  margin-top: var(--sp-6);\n  color: var(--muted);\n  font-size: var(--fs-small);\n}\n\n/* ------------------------------------------------------- notes / passages */\n\n.coach-notes { margin-top: var(--sp-4); }\n\n.coach-notes-toggle {\n  width: 100%;\n  min-height: 44px;\n  padding: 0 var(--sp-3);\n  text-align: left;\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-1);\n  background: var(--card);\n  color: var(--ink-soft);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.coach-notes-toggle:hover { border-color: var(--ink-soft); color: var(--ink); }\n\n.coach-notes-toggle.on {\n  border-color: var(--accent);\n  background: var(--accent-soft);\n  color: var(--accent);\n}\n\n.coach-note-list { display: grid; gap: var(--sp-2); margin-top: var(--sp-3); }\n\n.coach-note-block {\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--paper-2);\n}\n\n.coach-note-sec {\n  margin-bottom: var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-note-block p {\n  margin: 0 !important;\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n  white-space: pre-wrap;\n  overflow-wrap: anywhere;\n}\n\n.coach-note-src {\n  margin-top: var(--sp-3);\n  padding-top: var(--sp-2);\n  border-top: 1px solid var(--line);\n  color: var(--muted);\n  font: 400 var(--fs-label) var(--mono);\n}\n\n/* --------------------------------------------- disclosure (details) family\n   One disclosure treatment for the whole app: .coach-disclose, .fn-src,\n   .coach-reader and .coach-backup were four different widgets doing the\n   same job. They are now one. */\n\n.coach-disclose,\n.fn-src,\n.coach-reader,\n.coach-backup {\n  margin: 0 0 var(--sp-2);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--card);\n  overflow: hidden;\n  min-width: 0;\n}\n\n.coach-reader,\n.coach-backup { margin-top: var(--sp-5); background: var(--paper-2); }\n\n.coach-disclose > summary,\n.fn-src > summary,\n.coach-reader > summary,\n.coach-backup > summary {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--sp-3);\n  min-height: var(--tap);\n  padding: var(--sp-3) var(--sp-4);\n  cursor: pointer;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  color: var(--ink);\n  list-style: none;\n}\n\n.coach-disclose > summary::-webkit-details-marker,\n.fn-src > summary::-webkit-details-marker,\n.coach-reader > summary::-webkit-details-marker,\n.coach-backup > summary::-webkit-details-marker { display: none; }\n\n.coach-disclose > summary::after,\n.fn-src > summary::after,\n.coach-reader > summary::after,\n.coach-backup > summary::after {\n  content: '+';\n  flex: none;\n  display: grid;\n  place-items: center;\n  width: 24px;\n  height: 24px;\n  border: 1px solid var(--line-2);\n  border-radius: 999px;\n  color: var(--ink-soft);\n  font-weight: 600;\n  font-size: var(--fs-small);\n  line-height: 1;\n}\n\n.coach-disclose[open] > summary::after,\n.fn-src[open] > summary::after,\n.coach-reader[open] > summary::after,\n.coach-backup[open] > summary::after {\n  content: '\\2212';\n  border-color: var(--line-2);\n  background: var(--paper-2);\n  color: var(--ink-soft);\n}\n\n.fn-src-title { font-size: var(--fs-small); font-weight: 700; line-height: 1.4; }\n\n.fn-src > summary em,\n.coach-reader > summary em,\n.coach-backup > summary em {\n  flex: none;\n  margin-left: auto;\n  margin-right: var(--sp-2);\n  color: var(--muted);\n  font: 400 var(--fs-label) var(--mono);\n  font-style: normal;\n  white-space: nowrap;\n}\n\n.coach-body,\n.fn-src-body {\n  padding: 0 var(--sp-4) var(--sp-4);\n  font-size: var(--fs-small);\n  min-width: 0;\n}\n\n.coach-body p { margin-bottom: var(--sp-3); }\n\n.fn-hint { margin: 0 0 var(--sp-3); color: var(--muted); font-size: var(--fs-small); }\n\n.fn-speak {\n  min-height: 44px;\n  margin: 0 0 var(--sp-3);\n  padding: 0 var(--sp-3);\n  border: 1px solid var(--line-2);\n  border-radius: 999px;\n  background: var(--card);\n  color: var(--ink-soft);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.fn-speak:hover { border-color: var(--ink-soft); color: var(--ink); }\n\n.fn-passage {\n  margin: var(--sp-3) 0 0;\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--paper-2);\n  max-width: var(--coach-width);\n}\n\n.fn-where {\n  margin-bottom: var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.fn-passage p { margin: 0 0 var(--sp-2); font-size: var(--fs-body); line-height: var(--coach-leading); }\n.fn-passage p:last-child { margin-bottom: 0; }\n\n.fn-section .objective-section-head h3 { color: var(--ink); }\n\n/* ---------------------------------------------------------------- formulas\n   The highest-stakes screen. Words above symbols, one step per line, the\n   answer settled at the end. Never a table. */\n\n.coach-firm {\n  margin-bottom: var(--sp-5);\n  padding: var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  background: var(--card);\n}\n\n.coach-firm h3 { margin: 0 0 var(--sp-1); font-size: var(--fs-lead); font-weight: 700; }\n\n.coach-firmrows { margin: var(--sp-3) 0 0; display: grid; gap: 0; }\n\n.coach-firmrows dt {\n  padding-top: var(--sp-2);\n  color: var(--ink-soft);\n  font-size: var(--fs-small);\n  line-height: 1.5;\n}\n\n.coach-firmrows dd {\n  margin: 0;\n  padding-bottom: var(--sp-2);\n  border-bottom: 1px solid var(--line);\n  font: 600 var(--fs-body) var(--mono);\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-firmrows dd:last-child { border-bottom: 0; padding-bottom: 0; }\n\n.coach-formulas { display: grid; gap: var(--sp-3); }\n\n.coach-formula {\n  padding: var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  background: var(--card);\n}\n\n.coach-formula > header { cursor: pointer; }\n\n.coach-formula-name { font-size: var(--fs-title); font-weight: 700; letter-spacing: var(--ls-title); line-height: 1.3; }\n\n.coach-formula-name em {\n  margin-left: var(--sp-2);\n  color: var(--muted);\n  font: 400 var(--fs-label) var(--mono);\n  font-style: normal;\n  white-space: nowrap;\n}\n\n.coach-formula-tells { margin: var(--sp-2) 0 0 !important; color: var(--ink-soft); font-size: var(--fs-small); }\n\n/* Words first, and the only other typeface in the app. */\n.coach-formula-words {\n  margin-top: var(--sp-4);\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--paper-2);\n  font-family: ui-serif, Georgia, 'Times New Roman', serif;\n  font-size: var(--fs-lead);\n  font-weight: 400;\n  line-height: 1.55;\n}\n\n.coach-formula-symbols {\n  margin-top: var(--sp-2);\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--paper);\n  color: var(--ink-soft);\n  font: 400 var(--fs-small) var(--mono);\n  line-height: 1.6;\n  overflow-x: auto;\n}\n\n.coach-worked { margin-top: var(--sp-4); }\n\n.coach-worked-label {\n  margin-bottom: var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-worked ol {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n  counter-reset: step;\n  display: grid;\n  gap: 0;\n  border-top: 1px solid var(--line);\n}\n\n.coach-worked li {\n  position: relative;\n  padding: var(--sp-3) 0 var(--sp-3) var(--sp-6);\n  border-bottom: 1px solid var(--line);\n  font: 400 var(--fs-body) var(--mono);\n  line-height: 1.6;\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-worked li::before {\n  counter-increment: step;\n  content: counter(step);\n  position: absolute;\n  left: 0;\n  top: var(--sp-3);\n  color: var(--muted);\n  font: 600 var(--fs-small) var(--mono);\n}\n\n/* The end of a journey, not another row. */\n.coach-worked-answer {\n  margin-top: var(--sp-4);\n  padding: var(--sp-4);\n  border: 1px solid var(--correct-line);\n  border-radius: var(--cr-2);\n  background: var(--correct-soft);\n  color: var(--correct);\n  font: 700 var(--fs-title) var(--mono);\n  text-align: center;\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-worked-answer.collapsed {\n  margin-top: var(--sp-3);\n  padding: var(--sp-3);\n  font-size: var(--fs-body);\n  text-align: left;\n}\n\n/* Unmissable, but not an error state: a word, a hairline, a quiet ground. */\n.coach-trap {\n  margin-top: var(--sp-4);\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--wrong-line);\n  border-radius: var(--cr-2);\n  background: var(--wrong-soft);\n}\n\n.coach-trap span {\n  display: block;\n  margin-bottom: var(--sp-1);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--wrong);\n}\n\n.coach-trap p { margin: 0 !important; font-size: var(--fs-small); line-height: var(--coach-leading); }\n\n.coach-formula-why { margin: var(--sp-3) 0 0 !important; color: var(--muted); font-size: var(--fs-small); }\n\n.coach-story,\n.coach-checks {\n  margin-top: var(--sp-5);\n  padding: var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  background: var(--card);\n}\n\n.coach-story h3,\n.coach-checks h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-lead); font-weight: 700; }\n\n.coach-story ol { margin: 0; padding-left: var(--sp-5); display: grid; gap: var(--sp-3); }\n.coach-story li { font-size: var(--fs-small); line-height: var(--coach-leading); }\n.coach-story li::marker { color: var(--muted); font-weight: 600; }\n\n.coach-checks ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--sp-3); }\n\n.coach-checks li {\n  position: relative;\n  padding-left: var(--sp-5);\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n}\n\n.coach-checks li::before {\n  content: '';\n  position: absolute;\n  left: 2px;\n  top: .68em;\n  width: 5px;\n  height: 5px;\n  border-radius: 50%;\n  background: var(--line-2);\n}\n\n/* ------------------------------------------------------------------- rules */\n\n.coach-rulegroup { margin-bottom: var(--sp-6); }\n\n.coach-rulegroup h3 {\n  margin: 0 0 var(--sp-3);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-rulelist {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n  display: grid;\n  gap: 0;\n  border: 0;\n  border-radius: var(--cr-3);\n  background: var(--card);\n  overflow: hidden;\n}\n\n.coach-rulelist li {\n  display: flex;\n  align-items: baseline;\n  gap: 0;\n  min-height: var(--tap);\n  padding: var(--sp-3) var(--sp-4);\n  border-bottom: 1px solid var(--line);\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n}\n\n.coach-rulelist li:last-child { border-bottom: 0; }\n\n/* Flagged rule: the dot already names the state; the ground only agrees. */\n.coach-rulelist li.flag { background: var(--wrong-soft); }\n\n/* Ten-at-a-time mode: same list, taller rows, because each row is being\n   read and said back rather than scanned. */\n.coach-rules-ten li { min-height: 56px; align-items: center; }\n\n.coach-rule-sec {\n  display: block;\n  margin-top: var(--sp-1);\n  font: 400 var(--fs-label) var(--mono);\n  font-style: normal;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-rules-prog {\n  align-self: center;\n  margin-left: var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  color: var(--muted);\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-rulegroup.fn-src,\n.coach-refgroup.fn-src { background: var(--card); }\n\n/* ================================================= practice question screen\n   STILLNESS. Nothing on this screen may transition, animate or draw the eye\n   while he is deciding. The rule below is deliberate and load-bearing. */\n\n.coach-q *,\n.coach-q *::before,\n.coach-q *::after {\n  transition: none !important;\n  animation: none !important;\n}\n\n.coach-qhead {\n  display: flex;\n  align-items: center;\n  gap: var(--sp-3);\n  margin-bottom: var(--sp-5);\n}\n\n.coach-prog {\n  font: 600 var(--fs-small) var(--mono);\n  color: var(--ink);\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-meta {\n  flex: 1;\n  min-width: 0;\n  color: var(--muted);\n  font: 400 var(--fs-label) var(--mono);\n  letter-spacing: .02em;\n}\n\n.coach-cata-flag {\n  margin-bottom: var(--sp-4);\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--paper-2);\n  color: var(--ink-soft);\n  font-size: var(--fs-small);\n}\n\n.coach-cata-flag b { color: var(--ink); }\n\n.coach-stem { margin-bottom: var(--sp-5); font-size: var(--fs-body); }\n\n.coach-opts {\n  display: block;\n  border-radius: var(--cr-3);\n  background: var(--card);\n  overflow: hidden;\n}\n\n/* UNIFORM OPTS — one rule for all options. No option may differ from\n   another in weight, ground, radius, padding or type. */\n.coach-opt {\n  position: relative;\n  display: flex;\n  align-items: flex-start;\n  gap: var(--sp-3);\n  width: 100%;\n  min-height: var(--tap);\n  padding: var(--sp-3) var(--sp-4);\n  text-align: left;\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  color: var(--ink);\n  font: inherit;\n  font-size: var(--fs-body);\n  line-height: var(--coach-leading);\n  cursor: pointer;\n}\n\n/* Separator inset to the text, iOS-style — belongs to the group, not to any\n   option, so every option still has one shape. Never on the last row. */\n.coach-opt::after {\n  content: '';\n  position: absolute;\n  left: calc(var(--sp-4) + 1.9em);\n  right: 0;\n  bottom: 0;\n  height: 1px;\n  background: var(--line);\n}\n\n.coach-opt:last-child::after { content: none; }\n\n.coach-opt.on {\n  background: var(--accent-soft);\n  box-shadow: none;\n}\n\n.coach-opt-id {\n  flex: none;\n  display: grid;\n  place-items: center;\n  width: 28px;\n  height: 28px;\n  border-radius: 999px;\n  border: 1px solid var(--line-2);\n  background: var(--paper-2);\n  color: var(--ink-soft);\n  font: 600 var(--fs-small) var(--mono);\n}\n\n/* The letter sits on the accent ground. Defined once, AFTER .coach-opt-id,\n   so it wins on order as well as specificity. --card, not #fff or --paper:\n   it clears AA in light, dark and OLED alike. */\n.coach-opt.on .coach-opt-id {\n  border-color: var(--accent);\n  background: var(--accent);\n  color: var(--card);\n}\n\n.coach-opt-text { flex: 1; min-width: 0; }\n\n.coach-hint-none { margin-top: var(--sp-4); color: var(--muted); font-size: var(--fs-small); }\n\n.coach-confwrap {\n  margin-top: var(--sp-5);\n  padding-top: var(--sp-4);\n  border-top: 1px solid var(--line);\n}\n\n.coach-conflabel { margin-bottom: var(--sp-2); color: var(--ink); font-size: var(--fs-small); font-weight: 600; }\n\n.coach-confs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }\n\n.coach-conf {\n  min-height: var(--tap);\n  padding: 0 var(--sp-2);\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-2);\n  background: var(--card);\n  color: var(--ink);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.coach-conf:hover { border-color: var(--ink-soft); }\n\n.coach-qfoot { margin-top: var(--sp-6); }\n\n/* ----------------------------------------------------------- answer review */\n\n.coach-verdict {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--sp-2);\n  min-height: 34px;\n  padding: 0 var(--sp-3);\n  border-radius: 999px;\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .08em;\n  text-transform: uppercase;\n}\n\n.coach-verdict::before {\n  content: '';\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background: currentColor;\n}\n\n.coach-verdict-ok { border: 1px solid var(--correct-line); background: var(--correct-soft); color: var(--correct); }\n/* Not accent: a verdict is neither the thing you chose nor the thing to do\n   next. The word carries it. */\n.coach-verdict-warn { border: 1px solid var(--line-2); background: var(--paper-2); color: var(--ink); }\n.coach-verdict-bad { border: 1px solid var(--wrong-line); background: var(--wrong-soft); color: var(--wrong); }\n\n.coach-review .coach-note { margin-top: var(--sp-3); }\n\n.coach-answer { margin: var(--sp-4) 0 var(--sp-5); font-size: var(--fs-body); }\n\n/* THE SIGNATURE MOMENT — the one piece of motion in the app that is not a\n   direct response to a tap. After an answer, the rule to remember settles\n   in: 220ms, once, no bounce, no colour change, no sound. It is the only\n   keyframed animation in this stylesheet. */\n.coach-rule {\n  margin: var(--sp-5) 0 var(--sp-5);\n  padding: var(--sp-5);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  background: var(--paper-2);\n  animation: coach-settle 220ms var(--ease) both;\n}\n\n@keyframes coach-settle {\n  from { opacity: 0; transform: translateY(4px); }\n  to { opacity: 1; transform: none; }\n}\n\n.coach-rule-label {\n  display: block;\n  margin-bottom: var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-rule p {\n  margin: 0;\n  font-family: ui-serif, Georgia, 'Times New Roman', serif;\n  font-size: var(--fs-title);\n  font-weight: 400;\n  line-height: 1.45;\n}\n\n.coach-prov {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--sp-2);\n  margin-bottom: var(--sp-5);\n}\n\n.coach-cite,\n.coach-unreviewed {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--sp-2);\n  padding: var(--sp-1) var(--sp-3);\n  border: 1px solid var(--line-2);\n  border-radius: 999px;\n  background: var(--paper-2);\n  color: var(--ink-soft);\n  font: 400 var(--fs-label) var(--mono);\n  line-height: 1.6;\n}\n\n.coach-cite em { color: var(--ink-soft); font-style: normal; }\n\n.coach-unreviewed { border-color: var(--wrong-line); background: var(--wrong-soft); color: var(--wrong); }\n.coach-unreviewed::before { content: '!'; font-weight: 600; }\n\n/* ------------------------------------------------------- end of session */\n\n.coach-summary { margin: var(--sp-5) 0; display: grid; gap: 0; }\n\n.coach-summary dt {\n  padding-top: var(--sp-3);\n  color: var(--muted);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n.coach-summary dd {\n  margin: var(--sp-1) 0 0;\n  padding-bottom: var(--sp-3);\n  border-bottom: 1px solid var(--line);\n  font-size: var(--fs-body);\n  line-height: var(--coach-leading);\n}\n\n.coach-summary dd:last-of-type { border-bottom: 0; }\n\n/* ------------------------------------------------- reader controls, backup */\n\n.coach-reader-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: var(--sp-3);\n  padding: 0 var(--sp-4) var(--sp-4);\n}\n\n.coach-reader-grid label {\n  display: grid;\n  gap: var(--sp-1);\n  color: var(--muted);\n  font-size: var(--fs-small);\n  font-weight: 600;\n}\n\n.coach-reader-grid select {\n  min-height: 44px;\n  padding: 0 var(--sp-3);\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-1);\n  background: var(--paper);\n  color: var(--ink);\n  font: inherit;\n  font-size: var(--fs-small);\n}\n\n.coach-backup { padding-bottom: var(--sp-2); }\n\n.coach-backup p,\n.coach-backup button { margin-left: var(--sp-4); margin-right: var(--sp-4); }\n\n.coach-backup button { margin-bottom: var(--sp-3); }\n\n/* ================================================================ mock exam\n   A 2h40 sitting. The only element allowed to raise its voice is the clock,\n   and only near the end. */\n\n.mock-bar {\n  position: sticky;\n  top: 0;\n  z-index: 5;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--sp-2);\n  min-width: 0;\n  margin: 0 0 var(--sp-4);\n  padding: var(--sp-2) 0;\n  background: var(--paper);\n  border-bottom: 1px solid var(--line);\n}\n\n.mock-count {\n  font: 400 var(--fs-small) var(--mono);\n  color: var(--muted);\n  font-variant-numeric: tabular-nums;\n  white-space: nowrap;\n}\n\n.mock-clock {\n  font: 600 var(--fs-lead) var(--mono);\n  color: var(--ink-soft);\n  font-variant-numeric: tabular-nums;\n  white-space: nowrap;\n}\n\n/* Warn: heavier and darker. Danger: heavier again, and the only place in a\n   sitting where --wrong appears. The results screen states it in words. */\n.mock-clock.warn { color: var(--ink); font-weight: 700; }\n.mock-clock.danger { color: var(--wrong); font-weight: 700; }\n\n.mock-flag {\n  flex: 0 0 auto;\n  min-height: 44px;\n  padding: 0 var(--sp-3);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  color: var(--ink-soft);\n  background: var(--card);\n  border: 1px solid var(--line-2);\n  border-radius: 999px;\n  cursor: pointer;\n  white-space: nowrap;\n}\n\n.mock-flag:hover { border-color: var(--ink-soft); color: var(--ink); }\n\n.mock-flag.on {\n  color: var(--accent);\n  background: var(--accent-soft);\n  border-color: var(--accent);\n}\n\n.mock-flag.on::before { content: '⚑ '; }\n\n.mock-nav {\n  display: flex;\n  gap: var(--sp-2);\n  align-items: stretch;\n  margin-top: var(--sp-5);\n}\n\n.mock-nav .coach-btn { flex: 1 1 0; min-width: 0; text-align: center; }\n.mock-nav .coach-btn[disabled] { opacity: .38; cursor: default; }\n\n.mock-rules {\n  margin: var(--sp-5) 0;\n  padding: var(--sp-4);\n  background: var(--card);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n}\n\n.mock-rules h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-lead); font-weight: 700; }\n.mock-rules ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--sp-3); }\n.mock-rules li { font-size: var(--fs-small); line-height: var(--coach-leading); }\n.mock-rules li b { display: block; font-weight: 700; }\n.mock-warn { color: var(--wrong); font-weight: 600; }\n\n/* --- the item grid. Answered / blank / flagged read without colour. */\n.mock-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));\n  gap: var(--sp-2);\n  min-width: 0;\n  margin: var(--sp-4) 0 var(--sp-5);\n}\n\n.mock-cell {\n  position: relative;\n  aspect-ratio: 1;\n  min-width: 0;\n  padding: 0;\n  font: 400 var(--fs-small) var(--mono);\n  font-variant-numeric: tabular-nums;\n  color: var(--muted);\n  background: transparent;\n  border: 1px dashed var(--line-2);\n  border-radius: var(--cr-1);\n  cursor: pointer;\n}\n\n/* Answered: solid border, filled ground, heavier numeral. */\n.mock-cell.done {\n  color: var(--ink);\n  font-weight: 700;\n  background: var(--card);\n  border: 1px solid var(--ink-soft);\n}\n\n/* Flagged: a corner mark as well as a hue. */\n.mock-cell.flagged {\n  border: 1px solid var(--accent);\n  background: var(--accent-soft);\n  color: var(--accent);\n}\n\n.mock-cell.flagged::after {\n  content: '⚑';\n  position: absolute;\n  top: 0;\n  right: var(--sp-1);\n  font-size: var(--fs-label);\n  line-height: 1.2;\n}\n\n.mock-legend {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--sp-2) var(--sp-4);\n  margin-bottom: var(--sp-3);\n  font-size: var(--fs-small);\n  color: var(--muted);\n}\n\n.mock-legend span { display: inline-flex; align-items: center; gap: var(--sp-2); }\n\n.mock-key {\n  width: 16px;\n  height: 16px;\n  border: 1px dashed var(--line-2);\n  border-radius: var(--cr-0);\n  display: inline-block;\n}\n\n.mock-key.done { background: var(--card); border: 1px solid var(--ink-soft); }\n.mock-key.flagged { background: var(--accent-soft); border: 1px solid var(--accent); }\n\n.mock-submit { display: flex; flex-wrap: wrap; gap: var(--sp-2); }\n.mock-submit .coach-btn { flex: 1 1 auto; text-align: center; }\n\n/* --- results. A diagnosis, not a scoreboard. Every band says its verdict\n   in words; the tint only agrees with the sentence. */\n.mock-band {\n  margin: var(--sp-4) 0;\n  padding: var(--sp-4);\n  border-radius: var(--cr-3);\n  border: 1px solid var(--line);\n  background: var(--card);\n}\n\n.mock-band b { display: block; font-size: var(--fs-title); font-weight: 700; letter-spacing: var(--ls-title); margin-bottom: var(--sp-1); }\n.mock-band p { margin: 0; color: var(--ink-soft); font-size: var(--fs-small); }\n\n.mock-band-ok { border-color: var(--correct-line); background: var(--correct-soft); }\n.mock-band-warn { border-color: var(--line-2); background: var(--paper-2); }\n.mock-band-bad { border-color: var(--line-2); background: var(--paper-2); }\n\n.mock-caveat { font-size: var(--fs-small); color: var(--muted); }\n\n.mock-block {\n  margin: var(--sp-5) 0;\n  padding-top: var(--sp-4);\n  border-top: 1px solid var(--line);\n}\n\n.mock-block h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-lead); font-weight: 700; }\n\n.mock-facts,\n.mock-errs { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; }\n\n.mock-facts li,\n.mock-errs li {\n  display: flex;\n  align-items: baseline;\n  gap: var(--sp-3);\n  padding: var(--sp-3) 0;\n  border-bottom: 1px solid var(--line);\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n}\n\n.mock-facts li:last-child,\n.mock-errs li:last-child { border-bottom: 0; }\n\n/* A flagged fact is named in the sentence too — never hue alone. */\n.mock-facts li.flag { color: var(--ink); font-weight: 600; }\n\n.mock-secpct {\n  flex: 0 0 auto;\n  margin-left: auto;\n  min-width: 3.5em;\n  text-align: right;\n  font: 400 var(--fs-small) var(--mono);\n  font-variant-numeric: tabular-nums;\n  color: var(--ink-soft);\n}\n\n.mock-history { margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: 1px solid var(--line); }\n.mock-history h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-lead); font-weight: 700; }\n\n.mock-hist-row {\n  display: flex;\n  align-items: baseline;\n  gap: var(--sp-3);\n  padding: var(--sp-3) 0;\n  border-bottom: 1px solid var(--line);\n  min-width: 0;\n  font-size: var(--fs-small);\n}\n\n.mock-hist-row b { font-weight: 600; font-variant-numeric: tabular-nums; }\n.mock-hist-row span { color: var(--ink-soft); }\n\n.mock-hist-row em {\n  margin-left: auto;\n  color: var(--muted);\n  font-size: var(--fs-label);\n  font-style: normal;\n  white-space: nowrap;\n}\n\n/* --- walking back through a finished sitting */\n.mock-rev-opts { margin: var(--sp-4) 0; display: grid; gap: var(--sp-2); }\n\n.mock-rev-opt {\n  display: grid;\n  grid-template-columns: auto 1fr;\n  gap: var(--sp-1) var(--sp-3);\n  align-items: start;\n  min-width: 0;\n  padding: var(--sp-3) var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n  overflow-wrap: anywhere;\n}\n\n.mock-rev-opt.key { border-color: var(--correct-line); background: var(--correct-soft); }\n\n.mock-rev-opt em {\n  grid-column: 2;\n  font-style: normal;\n  font: 600 var(--fs-label) var(--mono);\n  color: var(--correct);\n  text-transform: uppercase;\n  letter-spacing: .08em;\n}\n\n.mock-rev-why { grid-column: 2; margin: var(--sp-1) 0 0; font-size: var(--fs-small); color: var(--ink-soft); }\n\n/* ============================================================== teach-back\n   A quiet notebook. Ticking a point is unmistakable and never rewarding. */\n\n.tb-prompt {\n  margin: var(--sp-4) 0 var(--sp-5);\n  padding: var(--sp-5);\n  font-size: var(--fs-title);\n  letter-spacing: var(--ls-title);\n  line-height: 1.5;\n  font-weight: 400;\n  background: var(--card);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n}\n\n.tb-prompt p { margin: 0; }\n.tb-prompt p + p { margin-top: var(--sp-3); }\n\n.tb-prompt.small {\n  padding: var(--sp-3) var(--sp-4);\n  margin-bottom: var(--sp-4);\n  font-size: var(--fs-small);\n  color: var(--ink-soft);\n  background: var(--paper-2);\n}\n\n.tb-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); }\n\n.tb-pad { margin-bottom: var(--sp-4); }\n\n.tb-nudge { color: var(--muted); font-size: var(--fs-small); }\n\n.tb-honest {\n  margin: var(--sp-4) 0;\n  padding: var(--sp-4);\n  border: 1px solid var(--line);\n  background: var(--card);\n  border-radius: var(--cr-3);\n}\n\n.tb-honest b { display: block; margin-bottom: var(--sp-2); font-weight: 700; }\n.tb-honest p { margin: 0; font-size: var(--fs-small); color: var(--ink-soft); }\n\n.tb-stats {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: var(--sp-2);\n  margin: var(--sp-5) 0;\n}\n\n.tb-stats > div {\n  min-width: 0;\n  padding: var(--sp-3) var(--sp-2);\n  text-align: left;\n  background: var(--card);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n}\n\n.tb-stats b {\n  display: block;\n  font-size: var(--fs-title);\n  font-weight: 700;\n  letter-spacing: var(--ls-title);\n  line-height: 1.2;\n  font-variant-numeric: tabular-nums;\n}\n\n.tb-stats span {\n  display: block;\n  margin-top: var(--sp-1);\n  font-size: var(--fs-label);\n  color: var(--muted);\n  overflow-wrap: anywhere;\n}\n\n.tb-points { margin: var(--sp-4) 0; display: grid; gap: var(--sp-2); }\n\n.tb-point {\n  display: grid;\n  grid-template-columns: auto 1fr;\n  gap: var(--sp-3);\n  align-items: start;\n  width: 100%;\n  min-width: 0;\n  min-height: var(--tap);\n  padding: var(--sp-3) var(--sp-4);\n  font: inherit;\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n  text-align: left;\n  color: var(--ink);\n  background: var(--card);\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-2);\n  cursor: pointer;\n  overflow-wrap: anywhere;\n}\n\n/* Ticked: the tick is the signal. No colour celebration, no accent. */\n.tb-point.on { border-color: var(--ink-soft); background: var(--paper-2); }\n\n.tb-tick {\n  display: grid;\n  place-items: center;\n  width: 24px;\n  height: 24px;\n  flex: 0 0 24px;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  color: transparent;\n  border: 1.5px solid var(--line-2);\n  border-radius: var(--cr-0);\n}\n\n.tb-point.on .tb-tick { border-color: var(--ink-soft); background: var(--card); color: var(--ink); }\n.tb-point.on .tb-tick::after { content: '✓'; }\n\n.tb-missed {\n  margin: var(--sp-4) 0;\n  padding: var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  background: var(--paper-2);\n}\n\n.tb-missed h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-lead); font-weight: 700; }\n.tb-missed ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--sp-3); }\n.tb-missed li { font-size: var(--fs-small); line-height: var(--coach-leading); }\n\n/* ================================================================ diagrams\n   Restyled frame and caption only. The SVG geometry is untouched. */\n\n.coach-figure { margin: 0 0 var(--sp-5); padding: 0; min-width: 0; }\n\n.coach-figure figcaption {\n  margin-bottom: var(--sp-2);\n  font-size: var(--fs-small);\n  font-weight: 700;\n  color: var(--ink);\n}\n\n.coach-figure-art {\n  padding: var(--sp-4);\n  background: var(--paper-2);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  overflow: hidden;\n}\n\n.coach-figure-art svg { display: block; width: 100%; height: auto; max-width: 100%; }\n\n.coach-figure-rule {\n  margin: var(--sp-2) 0 0;\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n  color: var(--ink-soft);\n}\n\n/* ========================================================== exam-day brief */\n\n.coach-examday-block { margin-bottom: var(--sp-4); }\n.coach-examday-block:last-child { margin-bottom: 0; }\n\n.coach-examday-block h4 {\n  margin: 0 0 var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-examday-block ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--sp-3); }\n\n.coach-examday-blo
