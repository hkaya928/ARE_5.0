ck li {\n  position: relative;\n  padding-left: var(--sp-4);\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n}\n\n.coach-examday-block li::before {\n  content: '';\n  position: absolute;\n  left: 2px;\n  top: .68em;\n  width: 5px;\n  height: 5px;\n  border-radius: 50%;\n  background: var(--line-2);\n}\n\n/* ============================================================== hands-free\n   Set up before driving, then glanced at, at arm's length, in daylight.\n   Big and plain beats refined on the player. */\n\n.au-safety {\n  margin: var(--sp-4) 0 var(--sp-5);\n  padding: var(--sp-4);\n  border: 1px solid var(--wrong-line);\n  background: var(--wrong-soft);\n  border-radius: var(--cr-3);\n}\n\n.au-safety b { display: block; margin-bottom: var(--sp-1); font-weight: 700; }\n.au-safety p { margin: 0; font-size: var(--fs-small); color: var(--ink-soft); }\n\n.au-tracks {\n  margin-bottom: var(--sp-5);\n  border-radius: var(--cr-3);\n  background: var(--card);\n  overflow: hidden;\n}\n\n.au-track {\n  position: relative;\n  display: block;\n  width: 100%;\n  min-width: 0;\n  min-height: var(--tap);\n  padding: var(--sp-4);\n  font: inherit;\n  font-size: var(--fs-small);\n  line-height: var(--coach-leading);\n  text-align: left;\n  color: var(--ink);\n  background: transparent;\n  border: 0;\n  border-radius: 0;\n  cursor: pointer;\n  overflow-wrap: anywhere;\n}\n\n.au-track::after {\n  content: '';\n  position: absolute;\n  left: var(--sp-4);\n  right: 0;\n  bottom: 0;\n  height: 1px;\n  background: var(--line);\n}\n\n.au-track:last-child::after { content: none; }\n\n.au-track:hover { background: var(--paper-2); }\n\n/* Chosen: accent frame and ground, heavier title, and a tick. */\n.au-track.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }\n\n.au-track b { display: block; margin-bottom: var(--sp-1); font-size: var(--fs-body); font-weight: 700; }\n.au-track.on b { color: var(--accent); }\n.au-track.on b::before { content: '✓ '; }\n\n.au-track b em {\n  margin-left: var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  font-style: normal;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.au-track span { display: block; color: var(--ink-soft); }\n\n.au-speeds { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-5); }\n\n.au-speed {\n  flex: 1 1 6em;\n  min-width: 0;\n  min-height: var(--tap);\n  padding: 0 var(--sp-2);\n  font: inherit;\n  font-size: var(--fs-small);\n  font-weight: 600;\n  color: var(--ink);\n  background: var(--card);\n  border: 1px solid var(--line-2);\n  border-radius: var(--cr-2);\n  cursor: pointer;\n}\n\n.au-speed:hover { border-color: var(--ink-soft); }\n.au-speed.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }\n\n.au-warn { color: var(--wrong); font-weight: 600; }\n.au-total { color: var(--muted); font-size: var(--fs-small); }\n\n/* --- the player: legibility at a glance, not elegance */\n\n.au-now {\n  margin: var(--sp-5) 0 var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.au-say {\n  margin-bottom: var(--sp-4);\n  padding: var(--sp-5) var(--sp-4);\n  font-size: var(--fs-display);\n  font-weight: 400;\n  line-height: 1.35;\n  letter-spacing: var(--ls-display);\n  background: var(--card);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  overflow-wrap: anywhere;\n}\n\n.au-meta {\n  margin-bottom: var(--sp-5);\n  font: 400 var(--fs-small) var(--mono);\n  color: var(--muted);\n  font-variant-numeric: tabular-nums;\n}\n\n.au-controls { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); }\n\n.au-big {\n  flex: 1 1 0;\n  min-width: 0;\n  min-height: 72px;\n  font-size: var(--fs-lead);\n  font-weight: 700;\n  text-align: center;\n}\n\n.au-go { min-height: 64px; font-size: var(--fs-lead); }\n\n\n/* --- au-setup: the screen he sets up in the driveway, with the engine off.\n   Section headings step out; everything else rides the screen rhythm. */\n\n.au-setup > .coach-h3 { margin-top: var(--pull-heading); }\n.au-setup > .au-safety { margin: 0; }\n.au-setup > .coach-backup { margin-top: var(--sp-6); }\n\n/* --- au-playing: the state that had no styling at all.\n   He is at a wheel. This must read in a quarter-second of peripheral\n   vision, from arm's length, in daylight. Three signals, none of them\n   colour on its own:\n     1. a persistent accent bar pinned to the top of the screen,\n     2. the word SPEAKING at display size, with a ▶ mark,\n     3. the current line on an accent-tinted ground.\n   Nothing on this screen is smaller than it was. */\n\n.au-playing { gap: var(--sp-4); padding-top: 0; }\n\n.au-playing::before {\n  content: '';\n  position: sticky;\n  top: 0;\n  z-index: 6;\n  display: block;\n  flex: none;\n  height: 6px;\n  margin-bottom: var(--sp-2);\n  background: var(--accent);\n}\n\n.au-playing > .coach-kicker { color: var(--accent); }\n\n.au-playing .au-now {\n  margin: 0;\n  color: var(--accent);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n/* The word, not a light. A mark carries it in greyscale. */\n.au-playing .au-now::before {\n  content: '▶ SPEAKING';\n  display: block;\n  margin-bottom: var(--sp-1);\n  font-family: var(--font);\n  font-size: var(--fs-display);\n  font-weight: 700;\n  letter-spacing: var(--ls-display);\n  line-height: 1.1;\n  text-transform: none;\n  color: var(--accent);\n}\n\n/* Current line: same display size as before, now on the accent ground so the\n   eye lands on it first. Text is --ink on a soft tint, never on the fill. */\n.au-playing .au-say {\n  border-color: var(--accent-line);\n  background: var(--accent-soft);\n  color: var(--ink);\n}\n\n.au-playing .au-meta { color: var(--ink-soft); }\n\n/* 72px stands. Widened to the full column and given a floor of 72px so a\n   larger reader size can grow them but nothing can shrink them. */\n.au-playing .au-controls { gap: var(--sp-2); margin: 0; }\n.au-playing .au-big { min-height: 72px; }\n.au-playing .au-go { min-height: 72px; }\n\n/* Stopping is deliberate: it sits away from the transport row. */\n.au-playing > .coach-next { margin-top: var(--sp-5); }\n\n/* ================================================================ readiness */\n\n.coach-ready-strip {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: var(--sp-2);\n  margin: 0 0 var(--sp-4);\n}\n\n.coach-ready-stat {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: var(--sp-1);\n  padding: var(--sp-3);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-2);\n  background: var(--card);\n}\n\n.coach-ready-stat .coach-dot { margin: 0; }\n\n.coach-ready-stat b {\n  font-size: var(--fs-title);\n  font-weight: 700;\n  letter-spacing: var(--ls-title);\n  line-height: 1.1;\n  font-variant-numeric: tabular-nums;\n}\n\n.coach-ready-stat span {\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--muted);\n  line-height: 1.3;\n}\n\n/* \"What to do next\" is an instruction, not an alarm. */\n.coach-ready-next {\n  margin: 0 0 var(--sp-4);\n  padding: var(--sp-4);\n  border: 1px solid var(--line);\n  border-radius: var(--cr-3);\n  background: var(--card);\n}\n\n.coach-ready-next.ok { border-color: var(--correct-line); background: var(--correct-soft); }\n\n.coach-ready-next span {\n  display: block;\n  margin-bottom: var(--sp-1);\n  font: 600 var(--fs-label) var(--mono);\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-ready-next.ok span { color: var(--correct); }\n\n.coach-ready-next p { margin: 0; font-size: var(--fs-body); font-weight: 600; line-height: 1.5; }\n.coach-ready-next p.coach-note { margin-top: var(--sp-1); font-weight: 400; font-size: var(--fs-small); }\n\n.coach-ready-section {\n  margin: 0 0 var(--sp-4);\n  padding: var(--sp-4);\n  border: 0;\n  border-radius: var(--cr-3);\n  background: var(--card);\n}\n\n.coach-ready-sechead { margin-bottom: var(--sp-3); padding-bottom: var(--sp-3); border-bottom: 1px solid var(--line); }\n\n.coach-ready-sechead h3 { margin: 0; font-size: var(--fs-lead); font-weight: 700; line-height: 1.35; }\n\n.coach-ready-sechead em {\n  display: block;\n  margin: var(--sp-1) 0 var(--sp-2);\n  font: 600 var(--fs-label) var(--mono);\n  font-style: normal;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.coach-ready-row {\n  display: flex;\n  align-items: center;\n  gap: var(--sp-3);\n  min-height: 44px;\n  padding: var(--sp-2) 0;\n  border-bottom: 1px solid var(--line);\n}\n\n.coach-ready-row:last-child { border-bottom: 0; }\n\n.coach-ready-main { flex: 1; min-width: 0; }\n.coach-ready-main b { display: block; font-size: var(--fs-small); font-weight: 700; line-height: 1.4; }\n\n.coach-ready-note { display: block; font-size: var(--fs-label); color: var(--muted); }\n.coach-ready-note.flag { color: var(--wrong); font-weight: 600; }\n\n.coach-ready-meter {\n  flex: none;\n  width: 56px;\n  height: 6px;\n  border-radius: 999px;\n  background: var(--line);\n  overflow: hidden;\n}\n\n.coach-ready-meter.big { width: 100%; height: 6px; }\n\n.coach-ready-fill { display: block; height: 100%; border-radius: 999px; background: var(--ink-soft); }\n\n/* .coach-fill is the base the five concatenated band variants sit on\n   ('coach-ready-fill coach-fill-' + band). It had no rule of its own. */\n.coach-fill { display: block; height: 100%; border-radius: 999px; background: var(--ink-soft); }\n\n/* The meter is a second reading of the band the dot already states. */\n.coach-fill-strong { background: var(--correct); }\n.coach-fill-developing { background: var(--ink-soft); }\n.coach-fill-weak { background: var(--wrong); opacity: .55; }\n.coach-fill-danger { background: var(--wrong); }\n.c
